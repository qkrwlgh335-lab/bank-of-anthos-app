name: Service CI and GitOps promotion

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
  workflow_dispatch:
    inputs:
      build_all:
        description: Build and promote all six services
        required: false
        default: true
        type: boolean

concurrency:
  group: bank-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  changes:
    name: Select changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
      has_changes: ${{ steps.services.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: services
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BUILD_ALL: ${{ inputs.build_all }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$BUILD_ALL" == "true" ]]; then
            python .github/scripts/changed_services.py --all
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            python .github/scripts/changed_services.py --base "$PR_BASE_SHA" --head "$GITHUB_SHA"
          else
            python .github/scripts/changed_services.py --base "$BEFORE_SHA" --head "$GITHUB_SHA"
          fi

  build-scan-push:
    name: ${{ matrix.name }} / test, scan, publish
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.path }}/uv.lock

      - name: Test Python service
        if: matrix.language == 'python' && matrix.name != 'frontend'
        working-directory: ${{ matrix.path }}
        run: uv run --frozen pytest

      - name: Validate frontend Python source
        if: matrix.name == 'frontend'
        working-directory: ${{ matrix.path }}
        run: uv run --frozen python -m compileall .

      - name: Set up Java 17
        if: matrix.language == 'java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test Java service
        if: matrix.language == 'java'
        run: ./mvnw -B -f "${{ matrix.path }}/pom.xml" test

      - name: Build immutable image once
        run: docker build --tag "bank-local/${{ matrix.name }}:${IMAGE_TAG}" "${{ matrix.path }}"

      - name: Select locally built image for scanning
        run: echo "PUBLISH_IMAGE=bank-local/${{ matrix.name }}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Report HIGH and CRITICAL vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.PUBLISH_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.PUBLISH_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials through GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Publish to or reuse immutable ECR tag
        id: ecr-image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -Eeuo pipefail
          repository="${{ vars.ECR_PREFIX }}/${{ matrix.name }}"
          target="${ECR_REGISTRY}/${repository}:${IMAGE_TAG}"
          error_file="${RUNNER_TEMP}/ecr-${{ matrix.name }}.err"

          if digest=$(aws ecr describe-images \
            --repository-name "$repository" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>"$error_file"); then
            echo "Reusing existing immutable ECR image: ${target}@${digest}"
            docker pull "$target"
            reused=true
          elif grep -q 'ImageNotFoundException' "$error_file"; then
            docker tag "bank-local/${{ matrix.name }}:${IMAGE_TAG}" "$target"
            docker push "$target"
            digest=$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            reused=false
          else
            cat "$error_file" >&2
            exit 1
          fi

          [[ "$digest" == sha256:* ]] || { echo "Invalid ECR digest: $digest"; exit 1; }
          echo "PUBLISH_IMAGE=$target" >> "$GITHUB_ENV"
          echo "PUBLISHED_ECR_IMAGE=$target" >> "$GITHUB_ENV"
          echo "ECR_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Re-scan the exact reused ECR artifact
        if: github.event_name != 'pull_request' && steps.ecr-image.outputs.reused == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.PUBLISH_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Authenticate to Google Cloud through WIF
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publish to or verify immutable Artifact Registry tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          registry="${{ vars.GCP_REGION }}-docker.pkg.dev"
          gcloud auth configure-docker "$registry" --quiet
          target="$registry/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ matrix.name }}:${IMAGE_TAG}"
          error_file="${RUNNER_TEMP}/gar-${{ matrix.name }}.err"

          if digest=$(gcloud artifacts docker images describe "$target" \
            --format='value(image_summary.digest)' 2>"$error_file"); then
            echo "Reusing existing immutable GAR image: ${target}@${digest}"
          elif grep -Eqi 'NOT_FOUND|not found|does not exist' "$error_file"; then
            docker tag "$PUBLISHED_ECR_IMAGE" "$target"
            docker push "$target"
            digest=$(gcloud artifacts docker images describe "$target" \
              --format='value(image_summary.digest)')
          else
            cat "$error_file" >&2
            exit 1
          fi

          [[ "$digest" == sha256:* ]] || { echo "Invalid GAR digest: $digest"; exit 1; }
          [[ "$digest" == "$ECR_DIGEST" ]] || {
            echo "Registry digest mismatch: ECR=$ECR_DIGEST GAR=$digest" >&2
            exit 1
          }
          echo "Verified build-once artifact in both registries: $digest"

  ci-required-gate:
    name: CI required gate
    if: always()
    needs: [changes, build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate service matrix result
        env:
          CHANGE_SELECTOR_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          BUILD_RESULT: ${{ needs.build-scan-push.result }}
        run: |
          set -Eeuo pipefail
          [[ "$CHANGE_SELECTOR_RESULT" == "success" ]] || { echo "Service selection failed"; exit 1; }
          if [[ "$HAS_CHANGES" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "At least one service test, image build, or HIGH/CRITICAL vulnerability gate failed"
            exit 1
          fi
          echo "CI required gate passed"

  promote-gitops:
    name: Promote immutable tags in GitOps
    needs: [changes, build-scan-push, ci-required-gate]
    if: github.event_name != 'pull_request' && needs.changes.outputs.has_changes == 'true' && needs.ci-required-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update only successfully built services
        shell: bash
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          mapfile -t services < <(python -c 'import json,os; print("\n".join(x["name"] for x in json.loads(os.environ["MATRIX"])["include"]))')
          python app/.github/scripts/update_gitops.py \
            --file gitops/gitops/apps/bank-of-anthos/overlays/dev/kustomization.yaml \
            --tag "$IMAGE_TAG" \
            --services "${services[@]}"

      - name: Commit desired-state change
        working-directory: gitops
        run: |
          git config user.name "bank-app-ci"
          git config user.email "bank-app-ci@users.noreply.github.com"
          git add gitops/apps/bank-of-anthos/overlays/dev/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: promote ${IMAGE_TAG}"
          git push origin HEAD:main
