apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-app-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: bank-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /bank-app/runtime
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-app-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: jwt-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /bank-app/jwt
