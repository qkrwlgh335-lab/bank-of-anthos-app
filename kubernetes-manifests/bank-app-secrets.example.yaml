# Local/development example only. Never commit real values.
# Production should create this Secret with External Secrets Operator and AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: bank-app-secrets
type: Opaque
stringData:
  REDIS_URL: redis://redis:6379/0
  ACCOUNTS_DB_URI: postgresql://accounts-admin:change-me@accounts-db:5432/accounts-db
  POSTGRES_USER: accounts-admin
  POSTGRES_PASSWORD: change-me
