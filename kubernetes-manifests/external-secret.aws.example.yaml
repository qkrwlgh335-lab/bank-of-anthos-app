# Requires External Secrets Operator and an IRSA-enabled SecretStore named aws-secretsmanager.
# Store a JSON object at /bank-of-anthos/application with matching property names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: bank-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: /bank-of-anthos/application
        property: REDIS_URL
    - secretKey: ACCOUNTS_DB_URI
      remoteRef:
        key: /bank-of-anthos/application
        property: ACCOUNTS_DB_URI
    - secretKey: POSTGRES_USER
      remoteRef:
        key: /bank-of-anthos/application
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /bank-of-anthos/application
        property: POSTGRES_PASSWORD
